services:
  api:
    build: .
    image: peer-review-assigner:latest
    container_name: peer-review-assigner
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
